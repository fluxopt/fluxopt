# pixi.lock is refreshed by .github/workflows/update-lockfiles.yaml, because
# Dependabot has no pixi ecosystem. What is left for it is the actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: ci
    groups:
      gh-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
