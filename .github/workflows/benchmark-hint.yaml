name: Benchmark hint

# A small performance hint on every PR: run the realistic reference-system
# suite (benchmark/test_reference.py) under pytest-benchmem and post its
# numbers as one sticky PR comment (and to the job summary). Informational
# only — deltas and dashboards are CodSpeed's job; local ref-vs-ref
# comparison is `benchmem sweep` (see benchmark/README.md).

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hint:
    name: Benchmark hint
    runs-on: ubuntu-latest
    continue-on-error: true # informational, never blocks a merge
    permissions:
      contents: read
      pull-requests: write # sticky comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          locked: true
          cache: true
          environments: bench
      - name: Run reference benchmarks (pytest-benchmem)
        working-directory: benchmark
        run: |
          pixi run -e bench pytest test_reference.py --benchmark-only --benchmark-memory \
            --benchmark-json "$RUNNER_TEMP/run.json"
      - name: Report the numbers
        working-directory: benchmark
        # A branch name is whatever the PR author typed, so it reaches the
        # script as data, never as `${{ }}` spliced into it.
        env:
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          {
            echo '### Benchmark hint'
            echo ''
            echo '`benchmark/test_reference.py` under [pytest-benchmem](https://github.com/fluxopt/pytest-benchmem) — quarter-year horizon; peak = memray allocator high-water, as on CodSpeed. The label columns are each model'\''s size: the temporal grid (timesteps × periods), element stats (components/flows/effects/series) and the measured solver model (variables/binaries/constraints). Shared-runner walltime is noisy: a hint, not a gate.'
            echo ''
            pixi run -e bench benchmem compare "$RUNNER_TEMP/run.json" \
              --format md --stat mean --group-by func \
              --columns time,peak,extra:timesteps,extra:periods,extra:components,extra:flows,extra:effects,extra:series,extra:variables,extra:binaries,extra:constraints
            echo ''
            echo '<details>'
            echo "<summary>Replicate locally / compare against ${BASE_REF}</summary>"
            echo ''
            echo '```bash'
            echo "uvx --from 'pytest-benchmem[plot]' benchmem sweep fluxopt \\"
            echo "    git+https://github.com/${REPO}@${BASE_REF} \\"
            echo "    git+https://github.com/${REPO}@${HEAD_REF} \\"
            echo '    --suite benchmark/ --memory'
            echo "uvx --from 'pytest-benchmem[plot]' benchmem compare .benchmarks/sweep/*.json"
            echo '```'
            echo ''
            echo 'One fresh venv per ref, checkout untouched; covers the archetype and reference-system benchmarks. Alternative flows: benchmark/README.md.'
            echo '</details>'
          } > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Post as sticky PR comment
        # Fork PRs get a read-only token; their numbers stay in the job summary.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh pr comment "${{ github.event.pull_request.number }}"
          --edit-last --create-if-none
          --body-file "$RUNNER_TEMP/comment.md"
