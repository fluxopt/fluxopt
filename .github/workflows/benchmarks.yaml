name: CodSpeed

# Both instruments in one workflow (CodSpeed aggregates per-commit results from a
# single workflow). Memory: heap tracking on a free GitHub runner, every PR +
# main. Walltime: bare-metal macro runner, main + the maintainer-gated
# `trigger:benchmark` label only.
#
# The benchmark env is pixi's `bench` environment, pinned by pixi.lock, so the
# dashboard tracks fluxopt's code, not upstream dependency releases.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory:
    name: Memory (heap)
    runs-on: ubuntu-latest
    continue-on-error: true # informational, never blocks a merge
    permissions:
      contents: read # actions/checkout
      id-token: write # OIDC auth with CodSpeed — no token secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          locked: true
          cache: true
          environments: bench
      - name: Run benchmarks under CodSpeed (memory)
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: memory
          run: pixi run -e bench bench-codspeed

  walltime:
    name: Walltime (macro runner)
    # main push / dispatch always; PRs only when explicitly labelled — macro
    # minutes are metered and bare-metal shouldn't run arbitrary PR code.
    if: >-
      ${{ github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'trigger:benchmark') }}
    runs-on: codspeed-macro
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          locked: true
          cache: true
          environments: bench
      - name: Run benchmarks under CodSpeed (walltime)
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          run: pixi run -e bench bench-codspeed
