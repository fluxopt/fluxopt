name: CI

# Every gate below is a pixi task, and `pixi run ci` runs them in this order.
# They are separate steps here only so a red run names the gate that broke;
# steps, unlike jobs, cost nothing extra. Do not split a step into a job of its
# own to parallelise it: each job pays for its own checkout and environment.
#
# CI runs on the declared floor, Python 3.12, and only there. The breakage a
# newer interpreter brings is almost always a standard-library feature newer
# than the floor, which a floor-pinned job catches. `pixi run -e py313 test`
# and `-e py314` run the newer ones locally.

on:
  push:
    branches:
      - main
  pull_request:
  # A push made with the GitHub App's token creates no pull_request run, so a
  # PR head can sit with the required check unreported; dispatching runs the
  # same gate on that head by hand.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # A required check. Fixed name, no matrix, so the branch ruleset can name
    # it directly and never needs updating.
    name: CI
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from `git describe`, and pixi builds
          # the package into the environment before anything runs.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          # `--locked`: pixi.lock is the environment, and a run that quietly
          # re-solved would not be testing what a contributor has.
          locked: true
          cache: true
          environments: default bench

      # A pull request that puts a version heading on top of CHANGELOG.md
      # releases it on merge, so the heading is checked here, before the merge
      # can act on it. See RELEASING.md.
      - name: Check the changelog headings
        run: pixi run python -m tools.changelog check

      # One step for every check that formats or lints a file: `lint` is
      # `lefthook run pre-commit --all-files`, the same jobs a commit runs, and
      # `fail_on_changes: always` means an unformatted tree fails here rather
      # than being fixed in place. ruff, pyrefly, typos, zizmor, prettier,
      # taplo and nbstripout all report from inside it.
      - name: Run linting
        run: pixi run lint
        env:
          CLICOLOR_FORCE: 1

      - name: Run pytest
        run: pixi run test-coverage --color=yes

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # `--strict` turns every warning into a failure, and `execute: true` in
      # mkdocs.yml runs every notebook, so a notebook the API left behind fails
      # here. Read the Docs runs the same task.
      - name: Build the docs
        run: pixi run docs-build

      # Every benchmarked function once, as a plain test, so API drift that
      # breaks the informational CodSpeed and hint suites fails CI here.
      - name: Benchmark suite smoke test
        run: pixi run -e bench bench-smoke

  windows:
    # Guards reading and writing files under a non-ASCII path (#189), which
    # only Windows gets wrong. The test suite alone, on the floor.
    name: Test (Windows)
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          locked: true
          cache: true
          environments: py312

      - name: Run pytest
        run: pixi run -e py312 test --color=yes
