# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/refs/heads/master/schema.json
output: [summary]
templates:
  run: run --as-is --quiet --no-progress
no_auto_install: true
pre-commit:
  fail_on_changes: always
  jobs:
    - name: pixi-install
      run: pixi install
    - group:
        parallel: true
        jobs:
          - name: ruff-check
            glob: "*.{py,pyi,ipynb}"
            run: pixi {run} ruff check --fix --exit-non-zero-on-fix --force-exclude
          - name: ruff-format
            glob: "*.{py,pyi,ipynb}"
            run: pixi {run} ruff format --force-exclude
          # No {staged_files}: pyrefly reads `project-includes` from
          # pyproject.toml, and a whole-project check is what CI runs. Feeding
          # it a subset would type-check src/ against whatever happened to be
          # staged.
          - name: pyrefly
            glob: "*.{py,pyi}"
            run: pixi {run} pyrefly check
          - name: nbstripout
            glob: "docs/**/*.ipynb"
            run: pixi {run} nbstripout {staged_files}
          - name: prettier
            glob: "*.{md,yml,yaml}"
            run: pixi {run} prettier --write --no-error-on-unmatched-pattern --list-different --ignore-unknown {staged_files}
          - name: taplo
            glob: "*.toml"
            run: pixi {run} taplo format {staged_files}
          - name: trailing-whitespace-fixer
            glob: "*"
            file_types: text
            run: pixi {run} trailing-whitespace-fixer {staged_files}
          - name: end-of-file-fixer
            glob: "*"
            file_types: text
            run: pixi {run} end-of-file-fixer {staged_files}
          - name: check-merge-conflict
            glob: "*"
            file_types: text
            run: pixi {run} check-merge-conflict --assume-in-merge {staged_files}
          - name: check-added-large-files
            # Generated, and committed on purpose.
            exclude: [pixi.lock]
            run: pixi {run} check-added-large-files {staged_files}
          - name: debug-statements
            glob: "*.py"
            run: pixi {run} debug-statement-hook {staged_files}
          - name: typos
            glob: "*"
            file_types: text
            run: pixi {run} typos --force-exclude {staged_files}
          - name: zizmor
            glob: "*.{yml,yaml}"
            run: pixi {run} zizmor --no-progress --min-severity high --fix --offline .
