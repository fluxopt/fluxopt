version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    install:
      # `--frozen` builds the site from pixi.lock, exactly as CI does.
      - pixi install -e default --frozen
    build:
      html:
        - pixi run docs-build
        # mkdocs writes the site to `site/`. Read the Docs publishes whatever
        # is under $READTHEDOCS_OUTPUT/html.
        - mkdir -p $READTHEDOCS_OUTPUT && cp -a site $READTHEDOCS_OUTPUT/html
