site_name: fluxopt
site_description: Energy system optimization with specsolve
repo_url: https://github.com/FBumann/fluxopt
repo_name: FBumann/fluxopt
edit_uri: edit/main/docs/
strict: true

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  # The tutorial and example pages are written by `python -m tools.notebooks`
  # from the notebooks beside them, which `docs-build` runs first.
  - Tutorials:
      - 1. Quickstart: notebooks/01-quickstart.md
      - 2. Storage: notebooks/02-storage.md
      - 3. Status: notebooks/03-status.md
      - 4. Piecewise: notebooks/04-piecewise.md
      - 5. Effects: notebooks/05-effects.md
      - 6. Sizing: notebooks/06-sizing.md
      - 7. Multi-Period: notebooks/07-multi-period.md
      - 8. Investment: notebooks/08-investment.md
  - Examples:
      - Heat System with Storage: notebooks/examples/heat-system.md
      - Multi-Node Heat: notebooks/examples/multi-node-heat.md
      - Investment: notebooks/examples/investment.md
  - Math:
      - Notation: math/notation.md
      - Objective: math/objective.md
      - Carrier Balance: math/carrier-balance.md
      - Flows: math/flows.md
      - Converters: math/converters.md
      - Storage: math/storage.md
      - Effects: math/effects.md
      - Sizing: math/sizing.md
      - Status: math/status.md
  # One page per module that declares an `__all__`: the public surface, not
  # every module under src/.
  - API Reference:
      - fluxopt: api/index.md
      - fluxopt.math: api/math.md
  - Benchmark: benchmark.md
  - Contributing: contributing.md
  - Changelog: changelog.md

theme:
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to system preference

  icon:
    repo: fontawesome/brands/github

  features:
    - header.autohide
    # navigation.instant left off: it swaps the document without a reload, so
    # neither MathJax nor the scripts inside a plotly figure would run on a page
    # reached by a click.
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: zensical.extensions.emoji.twemoji
      emoji_generator: zensical.extensions.emoji.to_svg
  # `check_paths` so a renamed include fails the build rather than rendering
  # as nothing. `docs/index.md` pulls the quickstart out of the README, and
  # `docs/changelog.md` and `docs/contributing.md` are whole files.
  - pymdownx.snippets:
      check_paths: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.xarray.dev/en/stable/objects.inv
            - https://pandas.pydata.org/docs/objects.inv
          options:
            extensions:
              - griffe_pydantic:
                  schema: true
            docstring_style: google
            docstring_section_style: table
            members_order: source
            show_if_no_docstring: false
            heading_level: 2
            show_root_heading: false
            show_root_toc_entry: false
            show_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            separate_signature: true
            line_length: 80
            modernize_annotations: true
            merge_init_into_class: true
            summary: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            parameter_headings: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FBumann/fluxopt
      name: fluxopt on GitHub
    - icon: simple/pypi
      link: https://pypi.org/project/fluxopt/
      name: fluxopt on PyPI

watch:
  - src/fluxopt
  - README.md
  - CHANGELOG.md
