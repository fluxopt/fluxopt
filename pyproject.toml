[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fluxopt"
dynamic = ["version"]
description = "Energy system models from components, as tables for math that mathspec states and specsolve solves."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Felix Bumann", email = "felixbumann387@gmail.com" }]
maintainers = [{ name = "Felix Bumann", email = "felixbumann387@gmail.com" }]
keywords = [
  "optimization",
  "energy systems",
  "linear programming",
  "mathspec",
  "specsolve",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "highspy>=1.13.1,!=1.14.*", # 1.14.x has MIP presolve bug producing wrong results (ERGO-Code/HiGHS#2975)
  # specsolve and mathspec are pinned to commits in pixi.toml, which is where
  # the development environment comes from.
  #
  # The modeling layer. fluxopt's math is the fragments in `math/program/`; specsolve
  # (formerly lpspec) validates it, lowers it and streams it to the solver.
  "specsolve",
  # The language half of specsolve, extracted to its own package so a consumer
  # that only declares and typesets math need not take an engine. fluxopt is
  # that consumer as well as an engine one: `FlowSystem.spec()` hands a
  # `Spec` to a caller who may only want to read or render it.
  "mathspec",
  "numpy>=1.26",
  # The one table type: data goes in as polars frames, the tables bound to the
  # spec are polars frames, and specsolve returns results as them. Direct
  # because fluxopt states schemas of its own — a column of labels no system
  # happens to fill must still say it holds labels.
  "polars>=1.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.urls]
repository = "https://github.com/FBumann/fluxopt"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/fluxopt"]
artifacts = ["src/fluxopt/math/program/*.yaml"]

[tool.hatch.build.targets.sdist]
include = ["src/fluxopt/", "LICENSE", "README.md"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # Pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "B",    # flake8-bugbear
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "FA",   # flake8-future-annotations
  "TC",   # flake8-type-checking
  "SIM",  # flake8-simplify
  "RUF",  # Ruff-specific rules
  "PERF", # perflint
  "C4",   # flake8-comprehensions
  "PIE",  # flake8-pie
  "RET",  # flake8-return
  "FLY",  # flynt (f-string)
  "FURB", # refurb
  "T20",  # flake8-print
  "PLC",  # pylint conventions
  "PLE",  # pylint errors
]
ignore = [
  "E501",    # line too long (handled by formatter)
  "RET504",  # unnecessary assignment before return
  "PLC0415", # import not at top level (used for circular import avoidance)
]
extend-fixable = ["B", "SIM", "RUF", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tools/**/*.py" = ["T201"]                              # a command says what it found
"benchmark/reference.py" = ["T201"]
"benchmark/flixopt_stress.py" = ["T201"]
"docs/notebooks/*.ipynb" = ["T201", "RUF001", "RUF003"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.lint.flake8-type-checking]
# pydantic models evaluate annotations at runtime to build validators, so imports
# used only in annotations must stay at runtime (not moved to TYPE_CHECKING).
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "fluxopt.elements.Element",
]

[tool.pyrefly]
python-version = "3.12"
project-includes = ["src"]
preset = "strict"

# Promote warn-by-default rules to error so regressions fail CI.
[tool.pyrefly.errors]
deprecated = true
implicit-import = true
missing-import = true
non-exhaustive-match = true
not-required-key-access = true
redundant-cast = true
redundant-condition = true
unknown-name = true
unnecessary-comparison = true
unnecessary-type-conversion = true
unreachable = true
unresolvable-dunder-all = true
untyped-import = true
variance-mismatch = true

[tool.pytest.ini_options]
addopts = "-n auto"
# Default run covers the correctness suite only. Benchmarks live in benchmark/
# and are opt-in: `pytest benchmark/ -p no:xdist --benchmark-only`.
testpaths = ["tests"]
# `.` for `tools`, whose changelog command tests/test_changelog.py covers.
pythonpath = ["tests", "."]
markers = ["slow: marks tests as slow"]

# No `[dependency-groups]`: the environments are pixi's, and every tool this
# project builds, tests, lints and documents itself with is a feature in
# pixi.toml. Keeping a second list here is how the two drift apart.

[tool.typos.files]
# The release-please history in CHANGELOG.md carries abbreviated commit hashes,
# which are not words.
extend-exclude = ["CHANGELOG.md", "pixi.lock"]

[tool.typos.default.extend-words]
# Each of these is deliberate, and none is reachable by fixing a spelling.
#
# `tou` is time-of-use, as in a TOU gas price. `wth` and `wel` are the tails of
# the units kWth and kWel. `ba` is part of effect ids such as `leaf_ba`. `mis`
# is the prefix of "mis-keyed". `sise` is misspelled on purpose in
# tests/test_data.py: the case is that a misspelled field is refused.
tou = "tou"
wth = "wth"
wel = "wel"
ba = "ba"
mis = "mis"
sise = "sise"
