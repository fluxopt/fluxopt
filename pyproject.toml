[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fluxopt"
dynamic = ["version"]
description = "Energy system optimization with lpspec — progressive modeling, from simple to complex."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Felix Bumann", email = "felixbumann387@gmail.com" },
]
maintainers = [
    { name = "Felix Bumann", email = "felixbumann387@gmail.com" },
]
keywords = ["optimization", "energy systems", "lpspec", "linear programming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "highspy>=1.13.1,!=1.14.*",  # 1.14.x has MIP presolve bug producing wrong results (ERGO-Code/HiGHS#2975)
    # The modeling layer. fluxopt's math is `math/program.yaml`; specsolve
    # (formerly lpspec) validates it, lowers it and streams it to the solver.
    "specsolve",
    # The language half of specsolve, extracted to its own package so a consumer
    # that only declares and typesets math need not take an engine. fluxopt is
    # that consumer as well as an engine one: `FlowSystem.math()` hands a
    # `Model` to a caller who may only want to read or render it.
    "mathspec",
    # Leaving. `model.py` is the last core module importing linopy; it is
    # deleted rather than ported, and this line goes with it. specsolve has
    # no eager lane any more, so `tests/test_engines_agree.py` skips.
    "linopy>=0.7.0",
    "netcdf4>=1.6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    # The interchange type with lpspec: parameter tables go in as tidy frames
    # and results come back as them. Direct because fluxopt states schemas of
    # its own — a column of labels no system happens to fill must still say it
    # holds labels.
    "polars>=1.30",
    # What polars needs to read a pandas 3 frame: pandas 3 stores labels as
    # Arrow strings, and `pl.from_pandas` refuses them without it.
    "pyarrow>=15",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "xarray>=2024.1.0",
]

[tool.uv.sources]
# Pinned to commits: the composed math needs mathspec's composition
# (energy-models/mathspec#732) and its empty sum (#742), which no release
# carries yet, and specsolve's main is the first engine on mathspec 0.2.
specsolve = { git = "https://github.com/fluxopt/lpspec.git", rev = "e78c1a3a04fc72ddfb3c5f04ddba326be2f72bb2" }
mathspec = { git = "https://github.com/energy-models/mathspec", rev = "0b0e4b0aa218ba38059615bc1af085bc10b80cda" }

[project.urls]
repository = "https://github.com/FBumann/fluxopt"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/fluxopt"]
artifacts = ["src/fluxopt/math/*.yaml"]

[tool.hatch.build.targets.sdist]
include = ["src/fluxopt/", "LICENSE", "README.md"]

[dependency-groups]
dev = [
    "pandas-stubs==3.0.3.260530",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pyrefly==1.1.1",
    "ruff==0.15.22",
]
docs = [
    "plotly>=6",
    "markdown-include==0.8.1",
    "mike==2.2.0",
    "mkdocs==1.6.1",
    "mkdocs-gen-files==0.6.1",
    "mkdocs-git-revision-date-localized-plugin==1.5.3",
    "mkdocs-include-markdown-plugin==7.3.0",
    "mkdocs-jupyter==0.26.3",
    "mkdocs-literate-nav==0.6.3",
    "mkdocs-material==9.7.7",
    "mkdocs-minify-plugin==0.8.0",
    "mkdocs-plotly-plugin==0.1.3",
    "mkdocs-table-reader-plugin==3.1.0",
    "mkdocstrings-python==2.0.5",
    "notebook==7.6.0",
    "pygments==2.20.0",
    "pymdown-extensions==11.0.1",
    "griffe-pydantic==1.3.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "B",     # flake8-bugbear
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "FA",    # flake8-future-annotations
    "TC",    # flake8-type-checking
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "PERF",  # perflint
    "C4",    # flake8-comprehensions
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "FLY",   # flynt (f-string)
    "FURB",  # refurb
    "T20",   # flake8-print
    "PLC",   # pylint conventions
    "PLE",   # pylint errors
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "RET504",   # unnecessary assignment before return
    "PLC0415",  # import not at top level (used for circular import avoidance)
]
extend-fixable = ["B", "SIM", "RUF", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/**/*.py" = ["T201", "RUF003"]
"src/fluxopt/benchmark.py" = ["T201"]
"docs/notebooks/*.ipynb" = ["T201", "RUF001", "RUF003"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.lint.flake8-type-checking]
# pydantic models evaluate annotations at runtime to build validators, so imports
# used only in annotations must stay at runtime (not moved to TYPE_CHECKING).
runtime-evaluated-base-classes = ["pydantic.BaseModel", "fluxopt.elements.Element"]

[tool.pyrefly]
python-version = "3.12"
project-includes = ["src"]
preset = "strict"

# Promote warn-by-default rules to error so regressions fail CI.
[tool.pyrefly.errors]
deprecated = true
implicit-import = true
missing-import = true
non-exhaustive-match = true
not-required-key-access = true
redundant-cast = true
redundant-condition = true
unknown-name = true
unnecessary-comparison = true
unnecessary-type-conversion = true
unreachable = true
unresolvable-dunder-all = true
untyped-import = true
variance-mismatch = true

[tool.pytest.ini_options]
addopts = "-n auto"
# Default run covers the correctness suite only. Benchmarks live in benchmark/
# and are opt-in: `pytest benchmark/ -p no:xdist --benchmark-only`.
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "slow: marks tests as slow",
]
