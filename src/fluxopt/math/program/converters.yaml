# A flow belongs to exactly one component, so the (converter, flow) matrix
# collapses to a lookup plus a coefficient keyed on flow.
description: A converter's linear equations tie the rates of its flows.

dimensions:
  time: {dtype: int}
  period: {dtype: int}
  converter: {dtype: str}
  eq_idx: {dtype: int}
  flow: {dtype: str}

relations:
  converter_of: {key: flow, values: converter}
  # The equations a converter states: one row per (converter, index).
  equation: {key: [converter, eq_idx]}

parameters:
  conversion_factor: {dims: [flow, eq_idx, time]}

given:
  variables:
    rate: {dims: [flow, time, period]}

constraints:
  conversion:
    dims: [converter, eq_idx, time, period]
    where: "equation"
    expression: sum(rate * conversion_factor, by=converter_of, over=flow, into=converter) == 0
