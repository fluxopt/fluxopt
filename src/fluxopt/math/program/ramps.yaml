# P_t - P_{t-1} <= r * dt * S. A gated flow is relaxed at a start-up in
# `ramps_status.yaml`.
# Periods are independent, so the first step has no row.
description: How fast a flow's rate may change from one step to the next.

dimensions:
  time: { dtype: datetime }
  period: { dtype: int }
  flow: { dtype: str }
  status_entity: { dtype: str }

relations:
  status_of: { key: flow, values: status_entity }

parameters:
  # r+ * dt, per unit of size. A flow with a ramp has a row, a ramp of 0
  # included; a flow without one has none.
  ramp_up_coeff: { dims: [flow, time, period] }
  ramp_down_coeff: { dims: [flow, time, period] }

given:
  variables:
    rate: { dims: [flow, time, period] }
  expressions:
    size: { dims: [flow, period] }

constraints:
  # A gated flow takes its rows from `ramps_status.yaml`, where a start-up
  # releases the limit.
  ramp_up:
    dims: [flow, time, period]
    where: "ramp_up_coeff AND NOT status_of AND position(time) != 0"
    expression: rate - shift(rate, along=time, offset=1) <= ramp_up_coeff * size

  ramp_down:
    dims: [flow, time, period]
    where: "ramp_down_coeff AND NOT status_of AND position(time) != 0"
    expression: shift(rate, along=time, offset=1) - rate <= ramp_down_coeff * size
