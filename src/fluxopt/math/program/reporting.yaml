# What a solution is read as. Nothing here is a constraint: every name is
# evaluated against a solve, and none of them reaches the solver.
description: The quantities a result is reported in.

dimensions:
  time: { dtype: datetime }
  period: { dtype: int }
  flow: { dtype: str }
  effect: { dtype: str }
  source: { dtype: str }

relations:
  same: { key: source, values: effect }

expressions:
  step_flow_hours:
    expression: rate * dt
    description: What each flow carries in a step, as energy.
  carrier_balance:
    expression: rate * carrier_sign
    description: Each flow's signed share of its carrier; it sums to zero per carrier and step.
  total_duration:
    expression: sum(dt * time_weight, over=time)
    description: How long the horizon is, weighted.
  capacity_factor:
    expression: flow_hours / (size * total_duration)
    description: What each flow carries, as a share of running at its size throughout.
  # Each contribution again, with what it charges through `contribution_from`
  # added: CO2 priced into cost is charged to the flow that emitted it.
  priced_flow_hour:
    expression: contribution_flow_hour + sum(share * at(contribution_flow_hour, by=same, over=effect, into=source), over=source)
    description: What each flow's throughput charges per step, cross-effects included.

given:
  parameters:
    dt: { dims: [time] }
    time_weight: { dims: [time] }
    carrier_sign: { dims: [flow] }
    share: { dims: [effect, source, period] }
  variables:
    rate: { dims: [flow, time, period] }
  expressions:
    size: { dims: [flow, period] }
    flow_hours: { dims: [flow, period] }
    contribution_flow_hour: { dims: [flow, effect, time, period] }
