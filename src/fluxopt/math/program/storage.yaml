# End-of-period storage convention, level[t] = level[t-1]*retention + net.
# Cyclic storage wraps (shift edge='wrap'), acyclic uses a data-side prior.
description: A storage carries a level from one step to the next.

dimensions:
  time: { dtype: datetime }
  period: { dtype: int }
  effect: { dtype: str }
  storage: { dtype: str }
  flow: { dtype: str }
  # The two ports of a storage. A flow on the charge port fills it, a flow on
  # the discharge port empties it.
  side: { dtype: str }

relations:
  # The storage and the port a flow is on. A flow on no storage has no row.
  port_of: { key: flow, values: [storage, side] }

parameters:
  # A storage whose capacity is given rather than decided.
  given_capacity: { dims: [storage] }
  # What one unit of rate on a port does to the level in a step:
  # eta_c * dt on the charge port, -dt / eta_d on the discharge port.
  storage_coeff: { dims: [storage, side, time] }
  # The share of its level a storage loses in an hour.
  relative_loss_per_hour: { dims: [storage, time] }
  # `relative_level_* * capacity`, folded data-side for the same reason
  # `rate_min` is, and dense for the same reason: a storage whose capacity is
  # a variable is bounded 0..inf here, and the relative pair does the work.
  level_min: { dims: [storage, time] }
  level_max: { dims: [storage, time] }
  is_cyclic: { dims: [storage], dtype: bool }
  # Carries a period axis so a rolling-horizon fold can collapse `time`
  # alone: a carry reduces exactly one dimension, and the level it copies
  # forward is per period.
  prior_level: { dims: [storage, period] }

  # End-of-horizon bounds and charge/discharge exclusion.
  final_level_min: { dims: [storage] }
  final_level_max: { dims: [storage] }
  prevent_simultaneous: { dims: [storage], dtype: bool }

  # Storage sizing.
  has_capacity_sizing: { dims: [storage], dtype: bool }
  capacity_mandatory: { dims: [storage], dtype: bool }
  capacity_min: { dims: [storage] }
  capacity_max: { dims: [storage] }
  relative_level_min: { dims: [storage, time] }
  relative_level_max: { dims: [storage, time] }
  effects_per_capacity: { dims: [storage, effect, period] }
  effects_fixed_capacity: { dims: [storage, effect, period] }

variables:
  level:
    dims: [storage, time, period]
    bounds: { lower: level_min, upper: level_max }

  chosen_capacity:
    dims: [storage, period]
    where: "has_capacity_sizing"
    bounds: { lower: 0, upper: capacity_max }

  capacity_built:
    dims: [storage, period]
    where: "has_capacity_sizing"
    domain: binary

  charging:
    dims: [storage, time, period]
    where: "prevent_simultaneous"
    domain: binary

expressions:
  # The capacity a storage has: the decision where it is one, the given
  # number otherwise. The rows that scale with a capacity read this.
  capacity:
    dims: [storage, period]
    cases:
      decided:
        when: "chosen_capacity"
        expression: chosen_capacity
    otherwise: given_capacity
    description: The capacity a storage has, whether it is decided or given.
  # What the level carries into a step. A cyclic storage wraps, so its first
  # step reads its last; an acyclic one starts from a data-side prior.
  level_before:
    dims: [storage, time, period]
    cases:
      cyclic:
        when: "is_cyclic"
        expression: shift(level, along=time, offset=1, edge='wrap')
      first:
        when: "NOT is_cyclic AND position(time) == 0"
        expression: prior_level
    otherwise: shift(level, along=time, offset=1)
    description: The level a storage carries into a step.
  retention:
    expression: (1 - relative_loss_per_hour) ** dt
    description: The share of its level a storage keeps through a step.
  port_rate:
    expression: sum(rate, by=port_of, over=flow, into=[storage, side])
    description: What flows through each port of a storage.
  net_charge:
    expression: sum(port_rate * storage_coeff, over=side)
    description: Energy entering a storage per step, net of discharge draw.
  # With the exclusion, one port is open in a step: charge while charging,
  # discharge otherwise.
  port_open:
    dims: [storage, side, time, period]
    cases:
      charge:
        when: "side == 'charge'"
        expression: charging
    otherwise: 1 - charging
    description: Whether a port may carry anything in a step.
  contribution_storage_per_capacity:
    expression: chosen_capacity * effects_per_capacity
    description: What a storage's built capacity costs, per period.
  contribution_storage_fixed:
    expression: capacity_built * effects_fixed_capacity
    description: What deciding to build a storage costs at all, per period.
  storage_costs:
    expression: >-
      sum(contribution_storage_per_capacity, over=storage)
      + sum(contribution_storage_fixed, over=storage)
    description: What building the storages adds to each effect.
    adds_to: direct_lump

given:
  parameters:
    size_bound: { dims: [flow] }
    dt: { dims: [time] }
  variables:
    rate: { dims: [flow, time, period] }
  expressions:
    direct_lump: { dims: [effect, period] }

constraints:
  storage_balance:
    dims: [storage, time, period]
    expression: level == level_before * retention + net_charge

  storage_final_min:
    dims: [storage, time, period]
    where: "position(time) == -1 AND final_level_min"
    expression: level >= final_level_min

  storage_final_max:
    dims: [storage, time, period]
    where: "position(time) == -1 AND final_level_max"
    expression: level <= final_level_max

  # --- P^c <= M^c b,  P^d <= M^d (1 - b)
  storage_no_simul:
    dims: [storage, side, time, period]
    where: "prevent_simultaneous"
    expression: port_rate <= sum(size_bound, by=port_of, over=flow, into=[storage, side]) * port_open

  # --- capacity as a decision variable: the level envelope becomes rows.
  cap_level_max:
    dims: [storage, time, period]
    where: "has_capacity_sizing"
    expression: level <= capacity

  cap_level_rel_min:
    dims: [storage, time, period]
    where: "has_capacity_sizing"
    expression: level >= relative_level_min * capacity

  cap_level_rel_max:
    dims: [storage, time, period]
    where: "has_capacity_sizing"
    expression: level <= relative_level_max * capacity

  cap_mandatory_built:
    dims: [storage, period]
    where: "has_capacity_sizing AND capacity_mandatory"
    expression: capacity_built == 1

  cap_min:
    dims: [storage, period]
    where: "has_capacity_sizing"
    expression: chosen_capacity >= capacity_min * capacity_built

  cap_max:
    dims: [storage, period]
    where: "has_capacity_sizing"
    expression: chosen_capacity <= capacity_max * capacity_built

assumptions:
  capacity_is_not_negative:
    holds: "level_max >= 0"
    description: a storage cannot hold less than nothing
  capacity_bounds_are_ordered:
    holds: "capacity_min >= 0 AND capacity_min <= capacity_max"
    where: "capacity_min"
    description: a capacity is not negative, and its minimum does not exceed its maximum
  charging_efficiency_is_a_fraction:
    holds: "storage_coeff > 0 AND storage_coeff <= dt"
    where: "side == 'charge'"
    description: charging stores at most what flows in, eta_charge in (0, 1]
  discharging_efficiency_is_a_fraction:
    holds: "storage_coeff <= 0 - dt"
    where: "side == 'discharge'"
    description: discharging draws at least what flows out, eta_discharge in (0, 1]
  loss_is_a_fraction:
    holds: "relative_loss_per_hour >= 0 AND relative_loss_per_hour <= 1"
    description: a storage loses between none and all of its level per hour
